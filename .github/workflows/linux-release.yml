name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build AppImage
        working-directory: app
        run: npm run dist:linux

      - name: Attach AppImage to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(app/release/*.AppImage)
          if ((${#assets[@]} != 1)); then
            echo "Expected one AppImage, found ${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[0]}" --repo "$GITHUB_REPOSITORY" --clobber
