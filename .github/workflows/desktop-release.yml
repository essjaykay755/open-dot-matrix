name: Build Windows and Linux installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and update
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            executable: release/win-unpacked/Open Dot Matrix.exe
          - os: ubuntu-22.04
            target: linux
            executable: release/linux-unpacked/open-dot-matrix
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }} x64
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests
        working-directory: app
        run: npm test

      - name: Build installer
        working-directory: app
        run: npm run dist:${{ matrix.target }} -- --x64 --publish never

      - name: Check packaged startup
        working-directory: app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node scripts/smoke-packaged.cjs "${{ matrix.executable }}"
          else
            node scripts/smoke-packaged.cjs "${{ matrix.executable }}"
          fi

      - name: Attach installer to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(app/release/*.AppImage app/release/*.exe)
          if ((${#assets[@]} != 1)); then
            echo "Expected one installer, found ${#assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[0]}" --repo "$GITHUB_REPOSITORY" --clobber
