<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Open Dot Matrix — open pixel ring</title>
  <rect width="64" height="64" rx="10" fill="#151A15"/>

  <!-- Unlit LEDs: three-by-three matrix, one deliberately open corner. -->
  <g fill="#293229">
    <rect x="7" y="7" width="14" height="14" rx="2"/>
    <rect x="25" y="7" width="14" height="14" rx="2"/>
    <rect x="43" y="7" width="14" height="14" rx="2"/>
    <rect x="7" y="25" width="14" height="14" rx="2"/>
    <rect x="25" y="25" width="14" height="14" rx="2"/>
    <rect x="43" y="25" width="14" height="14" rx="2"/>
    <rect x="7" y="43" width="14" height="14" rx="2"/>
    <rect x="25" y="43" width="14" height="14" rx="2"/>
    <rect x="43" y="43" width="14" height="14" rx="2"/>
  </g>

  <!-- A broken O, referencing the Open Dot Matrix name and LED hardware. -->
  <g fill="#D7FF69">
    <rect x="7" y="7" width="14" height="14" rx="2"/>
    <rect x="25" y="7" width="14" height="14" rx="2"/>
    <rect x="7" y="25" width="14" height="14" rx="2"/>
    <rect x="43" y="25" width="14" height="14" rx="2"/>
    <rect x="7" y="43" width="14" height="14" rx="2"/>
    <rect x="25" y="43" width="14" height="14" rx="2"/>
    <rect x="43" y="43" width="14" height="14" rx="2"/>
  </g>
</svg>
