appId: com.opendotmatrix.studio
productName: Open Dot Matrix
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.utilities
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Open Dot Matrix uses Bluetooth to connect to your LED display and send images, animations, and text.
linux:
  target:
    - AppImage
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
