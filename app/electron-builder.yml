appId: com.opendotmatrix.studio
productName: Open Dot Matrix
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
